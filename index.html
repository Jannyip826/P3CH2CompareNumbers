<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="color-scheme" content="light">
  <title>多位數排大小</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1f3a5f;
      --muted: #5b7394;
      --paper: #ffffff;
      --line: #c9ddf2;
      --blue: #2b79d4;
      --blue-deep: #1a5fb4;
      --green: #1f9d62;
      --green-deep: #146c43;
      --amber: #f5b301;
      --coral: #e85d4c;
      --purple: #6d4fd6;
      --shadow: 0 10px 28px rgba(47, 92, 150, 0.12);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      height: 100vh;
      height: 100dvh;
    }

    body {
      font-family: "PingFang TC", "Noto Sans TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #fff8d6 0%, transparent 50%),
        radial-gradient(ellipse 70% 45% at 100% 0%, #d8f5e8 0%, transparent 46%),
        linear-gradient(180deg, #dff1ff 0%, #f4fbff 48%, #eaf8f1 100%);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
      font-family: inherit;
      margin: 0;
      cursor: pointer;
      color: inherit;
      background-color: #fff;
      border: 2px solid var(--line);
    }

    button:disabled { opacity: 0.62; cursor: default; }

    .shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: calc(8px + var(--safe-t)) calc(12px + var(--safe-r)) calc(8px + var(--safe-b)) calc(12px + var(--safe-l));
      gap: 8px;
      max-width: 1400px;
      margin: 0 auto;
    }

    header.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      background: var(--paper);
      border: 2px solid #d7ebff;
      border-radius: 16px;
      padding: 7px 10px;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(180deg, #ffe58a, #ffd24d);
      border: 2px solid #f0c020;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #3d2c00;
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .brand p {
      margin: 0;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
    }

    .level-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .level-btn {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 900;
      background-color: #f0f6ff;
      border: 2px solid #b7cde6;
      color: var(--blue-deep);
      transition: all 0.15s ease;
    }

    .level-btn.active {
      background-color: var(--blue);
      border-color: var(--blue-deep);
      color: #fff;
      box-shadow: 0 3px 0 var(--blue-deep);
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-chip, .icon-btn {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 12px;
      font-weight: 800;
      border: 2px solid var(--line);
    }

    .stat-chip {
      background-color: #fff8e1;
      border-color: #ffe08a;
      color: #8a5a00;
      padding: 0 12px;
      font-size: 13px;
    }

    .stat-chip b { color: #c2410c; font-size: 16px; }

    .icon-btn {
      min-width: 44px;
      padding: 0 12px;
      background-color: #fff;
      color: var(--blue-deep);
      font-size: 14px;
    }

    .icon-btn.mute {
      background-color: #ffe8e4;
      border-color: #ffc2b8;
      color: var(--coral);
    }

    .icon-btn.reset {
      background-color: #fff3cc;
      border-color: #f5d36a;
      color: #8a5a00;
    }

    main.board {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .dir-badge {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 900;
      border: 2px solid;
    }

    .dir-badge.asc {
      background-color: #2b79d4;
      border-color: #1a5fb4;
      color: #fff;
      box-shadow: 0 4px 0 #1a5fb4;
    }

    .dir-badge.desc {
      background-color: #6d4fd6;
      border-color: #5538b8;
      color: #fff;
      box-shadow: 0 4px 0 #5538b8;
    }

    .hint {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .panel {
      background: var(--paper);
      border: 2px solid #d7ebff;
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 10px 12px;
      min-height: 0;
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 900;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.08em;
    }

    .slots-panel { flex: 1.15; display: flex; flex-direction: column; }
    .pool-panel { flex: 1; display: flex; flex-direction: column; }

    #slots-container, #cards-pool {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
      min-height: 88px;
    }

    .slot {
      flex: 1;
      min-width: 0;
      max-width: 210px;
      min-height: 72px;
      border: 3px dashed #b7cde6;
      border-radius: 14px;
      background-color: #f4faff;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 4px;
    }

    .slot.filled {
      border-style: solid;
      border-color: #8fb8ea;
      background-color: #fff;
    }

    .slot.slot-highlight {
      border-color: #2b79d4;
      background-color: #e7f2ff;
      transform: scale(1.03);
    }

    .op {
      width: 36px;
      min-width: 36px;
      align-self: center;
      height: 36px;
      border-radius: 50%;
      background-color: #f5b301;
      border: 2px solid #d69a00;
      color: #3d2c00;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .num-card {
      width: 100%;
      min-height: 64px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: clamp(16px, 2.2vw, 26px);
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      border: 2px solid #8fb8ea;
      background-color: #e7f2ff;
      color: #163a6b;
      box-shadow: 0 4px 0 rgba(31, 58, 95, 0.14);
      cursor: grab;
      touch-action: none;
      padding: 6px 8px;
      text-align: center;
      word-break: break-all;
    }

    .num-card.selected {
      outline: 3px solid #f5b301;
      outline-offset: 2px;
    }

    .num-card.ghost {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      opacity: 0.92;
      transform: scale(1.05);
      margin: 0;
    }

    #cards-pool .num-card {
      width: auto;
      min-width: 120px;
      max-width: 220px;
      flex: 1;
    }

    .shake-error { animation: shake 0.4s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    footer.actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      background: var(--paper);
      border: 2px solid #d7ebff;
      border-radius: 16px;
      padding: 8px 10px;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    .act {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 4px 0 rgba(31, 58, 95, 0.12);
    }

    .act:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(31, 58, 95, 0.12); }

    .act.reset {
      background-color: #fff3c4;
      border-color: #f0c14b;
      color: #8a5a00;
    }

    .act.ok {
      background-color: #1f9d62;
      border-color: #146c43;
      color: #fff;
      box-shadow: 0 4px 0 #146c43;
    }

    .act.next {
      background-color: #2b79d4;
      border-color: #1a5fb4;
      color: #fff;
      box-shadow: 0 4px 0 #1a5fb4;
    }

    .act.hidden { display: none; }

    .status {
      font-size: 14px;
      font-weight: 800;
      color: var(--muted);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(22, 58, 107, 0.45);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal.show { display: flex; }

    .modal-card {
      background: #fff;
      width: min(560px, 100%);
      max-height: min(92dvh, 680px);
      overflow: auto;
      border-radius: 22px;
      border: 3px solid #cfe3fb;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .modal-card.ok { border-color: #7dd3a8; }
    .modal-card.bad { border-color: #f5b0a6; }

    .modal-emoji {
      width: 64px;
      height: 64px;
      margin: 0 auto 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background-color: #e7f8ef;
      border: 3px solid #8ed3b0;
    }

    .modal-card.bad .modal-emoji {
      background-color: #ffe6e1;
      border-color: #f5b0a6;
    }

    .modal-card h2 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 22px;
    }

    .explain {
      background: #f4faff;
      border: 2px solid #cfe3fb;
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.55;
    }

    .explain.bad {
      background: #fff6f4;
      border-color: #f5b0a6;
    }

    .explain ul {
      margin: 6px 0;
      padding-left: 20px;
    }

    .order-line {
      margin: 8px 0;
      padding: 8px;
      background: #fff;
      border-radius: 10px;
      text-align: center;
      color: var(--blue-deep);
      font-weight: 900;
      word-break: break-all;
    }

    .primary {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      border-radius: 14px;
      background-color: #2b79d4;
      border-color: #1a5fb4;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 4px 0 #1a5fb4;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      display: none;
    }

    #confetti-canvas.show { display: block; }

    @media (orientation: landscape) and (min-width: 700px) {
      .brand p { display: none; }
      .dir-badge { font-size: 16px; }
    }

    @media (orientation: landscape) and (max-height: 820px) {
      .shell { gap: 6px; }
      .num-card { min-height: 56px; font-size: clamp(15px, 2vw, 22px); }
      .slot { min-height: 64px; }
      .act, .primary { min-height: 44px; }
    }

    @media (orientation: portrait) and (max-width: 900px) {
      body { overflow: auto; height: auto; min-height: 100dvh; }
      .shell { height: auto; min-height: 100dvh; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">排</div>
        <div>
          <h1>多位數排大小</h1>
          <p>由小至大 由大至小</p>
        </div>
      </div>
      <div class="level-bar">
        <button type="button" class="level-btn active" data-level="basic">基本題</button>
        <button type="button" class="level-btn" data-level="advanced">進階題</button>
        <button type="button" class="level-btn" data-level="challenge">挑戰題</button>
      </div>
      <div class="stats">
        <div class="stat-chip">首答對 <b id="first-correct-text">0</b> / 5</div>
        <div class="stat-chip">得分 <b id="score-text">0</b></div>
        <button type="button" id="sound-btn" class="icon-btn" aria-label="開關音效">音效 開</button>
        <button type="button" id="restart-btn" class="icon-btn reset">重新開始</button>
      </div>
    </header>

    <main class="board">
      <div class="task">
        <div id="dir-badge" class="dir-badge asc">請由小至大排列</div>
        <div class="hint">可拖拉數卡，或點一下數卡放入答案格</div>
      </div>

      <section class="panel slots-panel">
        <h2>答案格</h2>
        <div id="slots-container"></div>
      </section>

      <section class="panel pool-panel">
        <h2>待排列數卡</h2>
        <div id="cards-pool"></div>
      </section>
    </main>

    <footer class="actions">
      <button type="button" id="reset-btn" class="act reset">重置卡片</button>
      <span id="status-msg" class="status"></span>
      <button type="button" id="submit-btn" class="act ok" disabled>檢查答案</button>
      <button type="button" id="next-btn" class="act next hidden">下一題</button>
    </footer>
  </div>

  <div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
    <div id="modal-card" class="modal-card">
      <div id="modal-emoji" class="modal-emoji">🏆</div>
      <h2 id="modal-title">答對了</h2>
      <div id="modal-body"></div>
      <button type="button" id="modal-close" class="primary">繼續挑戰</button>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script>
    const TARGET_FIRST_TRY = 5;
    let firstTryCorrect = 0;
    let isFirstAttempt = true;
    let score = 0;
    let cardCount = 2;
    let currentLevel = 'basic'; // 'basic', 'advanced', 'challenge'
    let currentDirection = 'asc';
    let generatedNumbers = [];
    let sortedAnswer = [];
    let slotsData = [];
    let poolData = [];
    let selectedCardId = null;
    let soundMuted = false;
    let audioCtx = null;
    let dragState = null;
    let ghostEl = null;
    let skipClick = false;

    const slotsEl = document.getElementById('slots-container');
    const poolEl = document.getElementById('cards-pool');
    const dirBadge = document.getElementById('dir-badge');
    const firstCorrectText = document.getElementById('first-correct-text');
    const scoreText = document.getElementById('score-text');
    const submitBtn = document.getElementById('submit-btn');
    const nextBtn = document.getElementById('next-btn');
    const resetBtn = document.getElementById('reset-btn');
    const restartBtn = document.getElementById('restart-btn');
    const soundBtn = document.getElementById('sound-btn');
    const modal = document.getElementById('modal');
    const modalCard = document.getElementById('modal-card');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const modalEmoji = document.getElementById('modal-emoji');
    const modalClose = document.getElementById('modal-close');
    const levelBtns = document.querySelectorAll('.level-btn');

    const LEVEL_NAMES = {
      basic: '基本題',
      advanced: '進階題',
      challenge: '挑戰題'
    };

    function ensureAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol) {
      if (soundMuted) return;
      try {
        ensureAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playPick() { playTone(400, 'sine', 0.1, 0.12); }
    function playDrop() { playTone(280, 'triangle', 0.12, 0.16); }
    function playSuccess() {
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
        setTimeout(function () { playTone(f, 'sine', 0.28, 0.18); }, i * 90);
      });
    }
    function playError() {
      playTone(220, 'sawtooth', 0.2, 0.16);
      setTimeout(function () { playTone(180, 'sawtooth', 0.25, 0.16); }, 140);
    }

    function randDigits(n) {
      var min = Math.pow(10, n - 1);
      var max = Math.pow(10, n) - 1;
      return String(Math.floor(min + Math.random() * (max - min + 1)));
    }

    function similarNumbers(digits, count) {
      var set = {};
      var result = [];
      var base = [];
      while (new Set(base).size < 3) {
        base = [String(1 + Math.floor(Math.random() * 9))];
        for (var i = 1; i < digits; i++) base.push(String(Math.floor(Math.random() * 10)));
      }
      var similar = Math.min(count, Math.random() < 0.5 ? 2 : 3);
      var tries = 0;
      while (result.length < similar && tries < 150) {
        tries++;
        var p = base.slice();
        if (result.length > 0) {
          var a = Math.floor(Math.random() * digits);
          var b = Math.floor(Math.random() * digits);
          var tmp = p[a]; p[a] = p[b]; p[b] = tmp;
        }
        if (p[0] === '0') continue;
        var s = p.join('');
        if (!set[s]) { set[s] = true; result.push(s); }
      }
      while (result.length < count) {
        var n = randDigits(digits);
        if (!set[n]) { set[n] = true; result.push(n); }
      }
      return result;
    }

    function makeId() {
      return 'card-' + Math.random().toString(36).slice(2, 11);
    }

    function generateProblem() {
      isFirstAttempt = true;
      currentDirection = Math.random() < 0.5 ? 'asc' : 'desc';
      var numbers = [];
      var used = {};

      function addCard(numStr) {
        if (!used[numStr]) {
          used[numStr] = true;
          numbers.push({
            id: makeId(),
            valStr: numStr,
            valNum: BigInt(numStr),
            digits: numStr.length
          });
        }
      }

      var isOptionA = Math.random() < 0.5;

      if (currentLevel === 'basic') {
        cardCount = 2;
        if (isOptionA) {
          similarNumbers(5, 2).forEach(addCard);
        } else {
          addCard(randDigits(5));
          addCard(randDigits(4));
        }
      } else if (currentLevel === 'advanced') {
        cardCount = 3;
        if (isOptionA) {
          similarNumbers(5, 3).forEach(addCard);
        } else {
          similarNumbers(5, 2).forEach(addCard);
          while (numbers.length < 3) {
            addCard(randDigits(4));
          }
        }
      } else if (currentLevel === 'challenge') {
        cardCount = 4;
        if (isOptionA) {
          similarNumbers(5, 4).forEach(addCard);
        } else {
          var count5 = Math.floor(Math.random() * 3) + 1;
          var count4 = 4 - count5;
          similarNumbers(5, count5).forEach(addCard);
          similarNumbers(4, count4).forEach(addCard);
        }
      }

      generatedNumbers = numbers;
      poolData = numbers.slice().sort(function () { return Math.random() - 0.5; });
      sortedAnswer = numbers.slice().sort(function (a, b) {
        if (a.valNum < b.valNum) return currentDirection === 'asc' ? -1 : 1;
        if (a.valNum > b.valNum) return currentDirection === 'asc' ? 1 : -1;
        return 0;
      });
      slotsData = new Array(cardCount).fill(null);
      selectedCardId = null;
    }

    function renderBoard() {
      firstCorrectText.textContent = firstTryCorrect;
      scoreText.textContent = score;

      if (currentDirection === 'asc') {
        dirBadge.className = 'dir-badge asc';
        dirBadge.textContent = '請由小至大排列';
      } else {
        dirBadge.className = 'dir-badge desc';
        dirBadge.textContent = '請由大至小排列';
      }

      var op = currentDirection === 'asc' ? '<' : '>';
      slotsEl.innerHTML = '';
      for (var i = 0; i < cardCount; i++) {
        var slot = document.createElement('div');
        slot.className = 'slot' + (slotsData[i] ? ' filled' : '');
        slot.dataset.slotIndex = String(i);
        if (slotsData[i]) slot.appendChild(createCard(slotsData[i], true, i));
        slot.addEventListener('click', onSlotClick);
        slotsEl.appendChild(slot);
        if (i < cardCount - 1) {
          var opEl = document.createElement('div');
          opEl.className = 'op';
          opEl.textContent = op;
          slotsEl.appendChild(opEl);
        }
      }

      poolEl.innerHTML = '';
      poolData.forEach(function (card) {
        poolEl.appendChild(createCard(card, false, null));
      });

      submitBtn.disabled = slotsData.some(function (x) { return x === null; });
    }

    function createCard(cardObj, inSlot, slotIdx) {
      var el = document.createElement('div');
      el.className = 'num-card';
      if (selectedCardId === cardObj.id) el.classList.add('selected');
      el.dataset.cardId = cardObj.id;
      el.setAttribute('role', 'button');
      el.tabIndex = 0;
      el.textContent = cardObj.valStr;
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        if (skipClick) { skipClick = false; return; }
        onCardTap(cardObj, inSlot, slotIdx);
      });
      el.addEventListener('pointerdown', function (e) {
        onCardPointerDown(e, el, cardObj, inSlot, slotIdx);
      });
      return el;
    }

    function onCardTap(cardObj, inSlot, slotIdx) {
      playPick();
      if (inSlot) {
        slotsData[slotIdx] = null;
        poolData.push(cardObj);
        selectedCardId = null;
        renderBoard();
        return;
      }
      var empty = slotsData.findIndex(function (s) { return s === null; });
      if (empty !== -1) {
        slotsData[empty] = cardObj;
        poolData = poolData.filter(function (c) { return c.id !== cardObj.id; });
        selectedCardId = null;
        playDrop();
        renderBoard();
      } else {
        selectedCardId = selectedCardId === cardObj.id ? null : cardObj.id;
        renderBoard();
      }
    }

    function onSlotClick(e) {
      var slot = e.currentTarget;
      var idx = parseInt(slot.dataset.slotIndex, 10);
      if (!selectedCardId) return;
      var cardObj = poolData.find(function (c) { return c.id === selectedCardId; });
      if (!cardObj) return;
      if (slotsData[idx]) poolData.push(slotsData[idx]);
      slotsData[idx] = cardObj;
      poolData = poolData.filter(function (c) { return c.id !== selectedCardId; });
      selectedCardId = null;
      playDrop();
      renderBoard();
    }

    function onCardPointerDown(e, el, cardObj, inSlot, slotIdx) {
      if (e.button && e.button !== 0) return;
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      dragState = {
        cardObj: cardObj,
        inSlot: inSlot,
        slotIdx: slotIdx,
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
        pointerId: e.pointerId
      };

      var onMove = function (mv) {
        if (!dragState) return;
        var dx = mv.clientX - dragState.startX;
        var dy = mv.clientY - dragState.startY;
        if (!dragState.moved && (dx * dx + dy * dy) < 64) return;
        if (!dragState.moved) {
          dragState.moved = true;
          ghostEl = el.cloneNode(true);
          ghostEl.classList.add('ghost');
          ghostEl.style.width = el.offsetWidth + 'px';
          ghostEl.style.height = el.offsetHeight + 'px';
          document.body.appendChild(ghostEl);
        }
        ghostEl.style.left = (mv.clientX - ghostEl.offsetWidth / 2) + 'px';
        ghostEl.style.top = (mv.clientY - ghostEl.offsetHeight / 2) + 'px';
        highlightSlot(mv.clientX, mv.clientY);
      };

      var onUp = function (up) {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        if (ghostEl) { ghostEl.remove(); ghostEl = null; }
        clearHighlights();
        if (dragState && dragState.moved) {
          skipClick = true;
          handleDrop(up.clientX, up.clientY);
        } else if (dragState) {
          skipClick = true;
          onCardTap(dragState.cardObj, dragState.inSlot, dragState.slotIdx);
        }
        dragState = null;
      };

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    }

    function highlightSlot(x, y) {
      clearHighlights();
      var elem = document.elementFromPoint(x, y);
      if (!elem) return;
      var slot = elem.closest('[data-slot-index]');
      if (slot) slot.classList.add('slot-highlight');
    }

    function clearHighlights() {
      document.querySelectorAll('[data-slot-index]').forEach(function (s) {
        s.classList.remove('slot-highlight');
      });
    }

    function handleDrop(x, y) {
      if (!dragState) return;
      var cardObj = dragState.cardObj;
      var inSlot = dragState.inSlot;
      var slotIdx = dragState.slotIdx;
      var elem = document.elementFromPoint(x, y);
      if (!elem) return;
      var targetSlot = elem.closest('[data-slot-index]');
      var targetPool = elem.closest('#cards-pool');

      if (targetSlot) {
        var idx = parseInt(targetSlot.dataset.slotIndex, 10);
        if (inSlot && slotIdx === idx) return;
        if (inSlot) slotsData[slotIdx] = null;
        else poolData = poolData.filter(function (c) { return c.id !== cardObj.id; });
        if (slotsData[idx]) poolData.push(slotsData[idx]);
        slotsData[idx] = cardObj;
        playDrop();
        renderBoard();
      } else if (targetPool && inSlot) {
        slotsData[slotIdx] = null;
        poolData.push(cardObj);
        playDrop();
        renderBoard();
      }
    }

    function checkAnswer() {
      if (slotsData.some(function (x) { return x === null; })) return;
      var ok = true;
      for (var i = 0; i < cardCount; i++) {
        if (slotsData[i].id !== sortedAnswer[i].id) { ok = false; break; }
      }

      if (ok) {
        playSuccess();
        var isFirst = isFirstAttempt;

        if (isFirst) {
          firstTryCorrect++;
          score += 20;
        } else {
          score += 10;
        }
        
        firstCorrectText.textContent = firstTryCorrect;
        scoreText.textContent = score;

        if (firstTryCorrect >= TARGET_FIRST_TRY) {
          launchConfetti();
          var titleText = '恭喜完成「' + LEVEL_NAMES[currentLevel] + '」！';
          var bodyHtml = '<div class="explain" style="text-align:center"><div style="font-size:32px;color:#d69a00;font-weight:900">🎉 達成 5 次一次就答對！</div>' +
            '<p style="margin-top:10px;font-size:16px;">表現非常優秀！準備好挑戰下一關了嗎？</p></div>';
          
          if (currentLevel === 'basic') {
            modalClose.textContent = '進入進階題';
            modalClose.onclick = function() { closeModal(); switchLevel('advanced'); };
          } else if (currentLevel === 'advanced') {
            modalClose.textContent = '進入挑戰題';
            modalClose.onclick = function() { closeModal(); switchLevel('challenge'); };
          } else {
            modalClose.textContent = '重新開始遊戲';
            modalClose.onclick = function() { closeModal(); switchLevel('basic'); };
          }
          showModal(true, titleText, bodyHtml);
        } else {
          var msg = isFirst ? '答對了！第一次就答對，太厲害了！' : '修正成功！答對了！（此題曾答錯，不計入首答對次數）';
          showModal(true, '答對了！', successHtml(msg));
          submitBtn.classList.add('hidden');
          nextBtn.classList.remove('hidden');
          modalClose.textContent = '下一題';
          modalClose.onclick = function() { closeModal(); };
        }
      } else {
        playError();
        isFirstAttempt = false; // 答錯後取消首次答對資格，增加題目
        slotsEl.classList.add('shake-error');
        setTimeout(function () { slotsEl.classList.remove('shake-error'); }, 400);
        showModal(false, '再想一想', errorHtml());
        modalClose.textContent = '繼續嘗試';
        modalClose.onclick = function() { closeModal(); };
      }
    }

    function successHtml(customMsg) {
      var dir = currentDirection === 'asc' ? '由小至大' : '由大至小';
      var op = currentDirection === 'asc' ? ' < ' : ' > ';
      var has4 = generatedNumbers.some(function(c) { return c.digits === 4; });
      var has5 = generatedNumbers.some(function(c) { return c.digits === 5; });

      var explainText = '';
      if (has4 && has5) {
        explainText = '<b>位數不同時：</b>5 位數（萬位）必定大於 4 位數（千位）。<br><b>同位數時：</b>從最高位（左邊）開始逐位比較數字大小。';
      } else {
        explainText = '<b>所有數字皆為 5 位數：</b>比較時從最高位（萬位）開始逐位向右比較數字大小。';
      }

      return '<div class="explain">' +
        '<div style="color:#1f9d62;font-size:15px;margin-bottom:8px;"><b>' + customMsg + '</b></div>' +
        '<b>正確排列（' + dir + '）</b>' +
        '<div class="order-line">' + sortedAnswer.map(function (c) { return c.valStr; }).join(op) + '</div>' +
        explainText + '</div>';
    }

    function errorHtml() {
      var dir = currentDirection === 'asc' ? '由小至大（<）' : '由大至小（>）';
      var has4 = generatedNumbers.some(function(c) { return c.digits === 4; });
      var has5 = generatedNumbers.some(function(c) { return c.digits === 5; });

      var hints = '';
      if (has4 && has5) {
        hints = '<li>5 位數（萬位）必定大於 4 位數（千位）。</li>' +
                '<li>如果位數相同，請從最左邊（最高位）開始逐位比較。</li>';
      } else {
        hints = '<li>所有數字都是 5 位數。</li>' +
                '<li>請從最高位（最左邊的萬位）開始比較，若相同再看下一位。</li>';
      }

      return '<div class="explain bad"><b>觀察提示</b><ul>' +
        hints +
        '</ul>這題要「' + dir + '」排列。<br><span style="color:#e85d4c;">（答錯會自動增加題目，需在該部分達成 5 次一次就答對才能通關）</span></div>';
    }

    function showModal(ok, title, html) {
      modalTitle.textContent = title;
      modalBody.innerHTML = html;
      modalCard.className = 'modal-card ' + (ok ? 'ok' : 'bad');
      modalEmoji.textContent = ok ? '🏆' : '💡';
      modal.classList.add('show');
    }

    function closeModal() {
      modal.classList.remove('show');
    }

    function nextRound() {
      closeModal();
      submitBtn.classList.remove('hidden');
      nextBtn.classList.add('hidden');
      generateProblem();
      renderBoard();
    }

    function resetCards() {
      slotsData = new Array(cardCount).fill(null);
      poolData = generatedNumbers.slice().sort(function () { return Math.random() - 0.5; });
      selectedCardId = null;
      playPick();
      renderBoard();
    }

    function restartGame() {
      firstTryCorrect = 0;
      score = 0;
      submitBtn.classList.remove('hidden');
      nextBtn.classList.add('hidden');
      closeModal();
      generateProblem();
      renderBoard();
    }

    function switchLevel(level) {
      currentLevel = level;
      firstTryCorrect = 0;
      levelBtns.forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.level === level);
      });
      restartGame();
    }

    function launchConfetti() {
      var canvas = document.getElementById('confetti-canvas');
      var ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.classList.add('show');
      var colors = ['#e85d4c', '#2b79d4', '#1f9d62', '#f5b301', '#6d4fd6'];
      var particles = [];
      for (var i = 0; i < 100; i++) {
        particles.push({
          x: canvas.width / 2, y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.7) * 16,
          size: Math.random() * 8 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360, rs: (Math.random() - 0.5) * 8, life: 90
        });
      }
      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var alive = false;
        particles.forEach(function (p) {
          if (p.life <= 0) return;
          alive = true;
          p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.rot += p.rs; p.life -= 1.2;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.life / 90);
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
        if (alive) requestAnimationFrame(tick);
        else canvas.classList.remove('show');
      }
      tick();
    }

    levelBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        switchLevel(this.dataset.level);
      });
    });

    submitBtn.addEventListener('click', checkAnswer);
    nextBtn.addEventListener('click', nextRound);
    resetBtn.addEventListener('click', resetCards);
    restartBtn.addEventListener('click', restartGame);

    soundBtn.addEventListener('click', function () {
      soundMuted = !soundMuted;
      soundBtn.textContent = soundMuted ? '音效 關' : '音效 開';
      soundBtn.classList.toggle('mute', soundMuted);
    });
    window.addEventListener('resize', function () {
      var canvas = document.getElementById('confetti-canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
    window.onload = function () {
      generateProblem();
      renderBoard();
    };
  </script>
</body>
</html>
